<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magniguess — connection test</title>
<style>
  body {
    margin: 0; background: #0b0d12; color: #eef1f7; padding: 22px;
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
  h1 span { color: #6ee7b7; }
  .lede { color: #949cad; font-size: 14.5px; line-height: 1.6; margin: 0 0 18px; }
  .row {
    display: flex; gap: 10px; align-items: baseline; padding: 11px 13px; margin-bottom: 7px;
    background: #171b25; border: 1px solid #1d222d; border-radius: 11px; font-size: 14px;
  }
  .row .k { flex: 1; }
  .row .v { font-weight: 700; }
  .ok { color: #6ee7b7; } .bad { color: #f87171; } .warn { color: #fbbf24; } .dim { color: #626a7a; }
  .verdict {
    margin-top: 16px; padding: 14px 16px; border-radius: 12px;
    background: #12151d; border: 1px solid #262c39; font-size: 15px; line-height: 1.6;
  }
  .verdict b { color: #6ee7b7; }
  #copy {
    margin-top: 14px; padding: 12px 18px; border-radius: 11px; border: 1px solid #262c39;
    background: #171b25; color: #eef1f7; font: inherit; font-weight: 650; cursor: pointer; width: 100%;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Magni<span>guess</span> connection test</h1>
  <p class="lede">Checks whether this device can do the networking the online game needs. Run it on both devices and send me the results.</p>
  <div id="rows"></div>
  <div class="verdict" id="verdict">Testing…</div>
  <button id="copy" hidden>Copy results</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
var CURRENT_BUILD = "2026-09-10d";
var TURN_USER = "openrelayproject";
var ICE = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "turn:openrelay.metered.ca:80", username: TURN_USER, credential: TURN_USER },
  { urls: "turn:openrelay.metered.ca:443", username: TURN_USER, credential: TURN_USER },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: TURN_USER, credential: TURN_USER }
];
var rows = document.getElementById("rows");
var results = [];
function row(k, v, cls) {
  results.push(k + ": " + v);
  var el = document.createElement("div");
  el.className = "row";
  el.innerHTML = '<span class="k">' + k + '</span><span class="v ' + (cls || "dim") + '">' + v + '</span>';
  rows.appendChild(el);
}

// Which kinds of network path this device can obtain. "relay" is the one that
// rescues strict networks; with neither srflx nor relay, nothing can connect.
function gatherCandidates() {
  return new Promise(function (resolve) {
    var types = {};
    var pc;
    try { pc = new RTCPeerConnection({ iceServers: ICE }); }
    catch (e) { return resolve(types); }
    pc.createDataChannel("t");
    pc.onicecandidate = function (e) {
      if (!e.candidate) { try { pc.close(); } catch (x) {} return resolve(types); }
      var m = /typ (\w+)/.exec(e.candidate.candidate);
      if (m) types[m[1]] = true;
    };
    pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).catch(function () {});
    setTimeout(function () { try { pc.close(); } catch (x) {} resolve(types); }, 9000);
  });
}

(async function () {
  row("Page served over", location.protocol.replace(":", ""), location.protocol === "https:" ? "ok" : "bad");
  row("WebRTC available", typeof RTCPeerConnection === "function" ? "yes" : "no",
      typeof RTCPeerConnection === "function" ? "ok" : "bad");
  row("PeerJS library", typeof Peer === "function" ? "loaded" : "blocked",
      typeof Peer === "function" ? "ok" : "bad");

  var brokerOk = false;
  if (typeof Peer === "function") {
    brokerOk = await new Promise(function (res) {
      var p;
      try { p = new Peer({ debug: 0, config: { iceServers: ICE } }); }
      catch (e) { return res(false); }
      p.on("open", function () { try { p.destroy(); } catch (e) {} res(true); });
      p.on("error", function () { res(false); });
      setTimeout(function () { try { p.destroy(); } catch (e) {} res(false); }, 12000);
    });
  }
  row("Matchmaking server", brokerOk ? "reachable" : "unreachable", brokerOk ? "ok" : "bad");

  // Is this browser still being served an old cached copy of the game?
  var build = "unknown";
  try {
    var html = await fetch("./index.html", { cache: "no-store" }).then(function (r) { return r.text(); });
    var m = /const BUILD = "([^"]+)"/.exec(html);
    build = m ? m[1] : "older build (no stamp)";
  } catch (e) { build = "could not check"; }
  row("Game version this browser gets", build, build === CURRENT_BUILD ? "ok" : "bad");

  var types = await gatherCandidates();
  row("Local network path", types.host ? "yes" : "no", types.host ? "ok" : "warn");
  row("Public address (STUN)", types.srflx ? "yes" : "no", types.srflx ? "ok" : "warn");
  row("Relay fallback (TURN)", types.relay ? "yes" : "no", types.relay ? "ok" : "bad");

  var v = document.getElementById("verdict");
  if (build !== CURRENT_BUILD) {
    v.innerHTML = "<b>This browser is still running an old copy of the game.</b> Open " +
      "<a href='./fix.html' style='color:#7dd3fc'>the repair page</a> once, then come back and re-run this test.";
  } else if (!brokerOk) {
    v.innerHTML = "<b>Cannot reach the matchmaking server.</b> Something on this network is blocking it — a school or office firewall, or a content blocker. Try a phone hotspot.";
  } else if (types.relay) {
    v.innerHTML = "<b>This device should work.</b> It can fall back to a relay, which gets through even strict networks.";
  } else if (types.srflx) {
    v.innerHTML = "<b>This device should work on most networks</b>, but has no relay fallback. If the other device is on a strict network, the pair may still fail.";
  } else {
    v.innerHTML = "<b>This device can only see its own local network.</b> No public address and no relay, so it cannot reach anyone outside this wifi.";
  }
  results.push("verdict: " + v.textContent);

  var btn = document.getElementById("copy");
  btn.hidden = false;
  btn.addEventListener("click", async function () {
    var text = results.join("\n") + "\nUA: " + navigator.userAgent;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied — paste it in the chat"; }
    catch (e) { window.prompt("Copy this:", text); }
  });
})();
</script>
</body>
</html>
