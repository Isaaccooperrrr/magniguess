<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magniguess — refreshing</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0d12; color: #eef1f7; text-align: center; padding: 24px;
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  .box { max-width: 420px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 10px; }
  h1 span { color: #6ee7b7; }
  p { color: #949cad; line-height: 1.6; margin: 0 0 18px; font-size: 15px; }
  #log { font-size: 13px; color: #626a7a; line-height: 1.8; font-variant-numeric: tabular-nums; }
  a {
    display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 12px;
    background: linear-gradient(180deg, #7ff0c1, #43c99b); color: #06231a;
    font-weight: 750; text-decoration: none;
  }
</style>
</head>
<body>
<div class="box">
  <h1>Magni<span>guess</span></h1>
  <p>Clearing an old cached copy of the game from this browser. This takes a second and only needs doing once.</p>
  <div id="log"></div>
  <a id="go" href="./index.html?fresh=1" hidden>Open the game</a>
</div>
<script>
// This filename was never in the old cache, so it is always served fresh —
// which makes it a way back for a browser pinned to a stale build.
const log = document.getElementById("log");
const say = (m) => { log.innerHTML += m + "<br>"; };

(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      say(`✓ removed ${regs.length} old worker${regs.length === 1 ? "" : "s"}`);
    }
  } catch (e) { say("· could not read workers (that's fine)"); }

  try {
    const names = await caches.keys();
    await Promise.all(names.map(n => caches.delete(n)));
    say(`✓ cleared ${names.length} cache${names.length === 1 ? "" : "s"}`);
  } catch (e) { say("· could not clear caches (that's fine)"); }

  say("✓ done — opening the latest version");
  document.getElementById("go").hidden = false;
  setTimeout(() => { location.replace("./index.html?fresh=" + Date.now()); }, 1200);
})();
</script>
</body>
</html>
